# Параметры ноды tram_odometry. Пути к карте и таблице модели по умолчанию — из share пакета.
tram_odometry:
  ros__parameters:
    wheel_kmh_per_mps: 3.5966    # делитель «км/ч тележки -> м/с» (медиана по данным); vehicle_id уточняет
    init_window_s: 5.0           # GNSS только для выставки в первые секунды
    traction_delay_s: 0.4        # задержка отклика привода на позицию контроллера
    sigma_a: 0.25                # СКО ошибки модели ускорения, м/с²
    sigma_d: 0.02                # блуждание возмущающего ускорения, м/с²/√с
    sigma_wheel: 0.05            # шум скорости тележки, м/с
    gate_chi2: 9.0               # гейтинг невязки колёс (3σ)
    resync_s: 3.0                # долгое расхождение модели и колёс — сброс к колёсам
    bogie_tol_abs: 0.3           # допустимое расхождение тележек, м/с
    bogie_tol_rel: 0.05
    stop_confirm_s: 2.0          # стоянка дольше — привязка к месту регулярной стоянки
    map_frame: map
    base_frame: base_link
