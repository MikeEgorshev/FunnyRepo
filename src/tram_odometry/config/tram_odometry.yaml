# Параметры ноды tram_odometry. Дробные значения пишите с точкой (25.0, а не 25):
# ROS 2 не приводит int к double и откажется стартовать.
# Параметры модели — стартовые оценки, их заменит идентификация по данным.
tram_odometry:
  ros__parameters:
    front_topic: /vehicle/front_bogie_velocity
    rear_topic: /vehicle/rear_bogie_velocity
    cmd_topic: /vehicle/driver_position_cmd
    gnss_topic: /sensing/gnss/master/fix       # читается только в окне выставки
    rover_topic: /sensing/gnss/rover/fix       # база master → rover даёт курс и на стоянке
    velocity_topic: /result/velocity
    position_topic: /result/position
    diagnostics_topic: /result/diagnostics
    frame_id: map
    child_frame_id: base_link
    rate_hz: 25.0                  # частота публикации /result/*
    diagnostics_hz: 2.0
    max_extrapolation_s: 0.5       # прогноз выхода вперёд от последнего входа, не дольше
    gnss_init_window_s: 5.0        # GNSS гарантирован только в первые секунды прогона
    gnss_min_move_m: 3.0           # меньше — курс по GNSS не определён
    gnss_corrections: false        # фиксы после выставки -> привязки дистанции (решение команды)
    initial_yaw: 0.0               # рад от оси восток, если курс не определён
    output_frame: mgrs             # сетка судьи: UTM 37N минус (300000, 6100000); enu — от первой точки GNSS
    route_map_file: ''             # карта линии CSV (s_m, lat, lon, alt); пусто — запасная прямая
    stops_file: ''                 # места стоянок CSV (s_m, sigma_m); пусто — без привязок
    output_lever_m: 9.873          # антенна master -> base_link вперёд по пути, м (QA 25.09)
    output_dz_m: -3.0              # антенна на 3 м выше рельса
    var_cross: 1.0                 # м², поперечная неопределённость положения
    var_z: 4.0                     # м²
    var_yaw: 0.01                  # рад²

    model:
      notch_max: 15
      a_max: 1.1                   # м/с², тяга на позиции 15 ниже базовой скорости
      v_base: 7.0                  # м/с, выше — постоянная мощность
      b_max: 1.3                   # м/с², тормоз на позиции -15
      v_blend: 1.8                 # м/с, ниже электрический тормоз слабеет
      blend_floor: 0.8
      res_a: 0.015                 # сопротивление A + B·v + C·v², м/с²
      res_b: 0.0
      res_c: 0.0005
      v_stop: 0.3
      tau_cmd: 0.0                 # с, запаздывание силы за контроллером (идентифицируется)

    filter:
      k0: 3.5966                   # (км/ч по тележке) / (м/с): 30618 — 3.5953, 30639 — 3.6106
      sigma_k0: 0.02
      sigma_v0: 0.5
      q_accel: 0.15
      q_d: 0.02
      q_k: 0.00001
      r_wheel: 0.15                # км/ч
      gate: 9.0                    # χ², 3σ
      flag_after: 3
      reject_max_s: 6.0            # с, дольше подряд на одной модели не едем
      r_recover: 3.0
      zupt_speed: 0.1
      zupt_max_est: 1.0
      r_zupt: 0.02
      step_s: 0.05
      max_gap_s: 120.0
      reset_back_s: 10.0           # с, меньший скачок назад — опоздавший отсчёт, а не новый прогон
      max_lag_s: 0.25
      k_min_dist_m: 200.0          # м между привязками, чтобы уточнять k
      k_max_rel: 0.03              # k не уходит от k0 дальше 3 %
      trust_agreeing: true         # согласные тележки без флагов — без χ²-отсева
      agree_abs: 0.15              # м/с
      agree_rel: 0.015

    stops:
      dwell_s: 5.0                 # с, стоянка короче — привязки нет
      stop_speed: 0.1
      moving_speed: 0.5
      gate_sigma: 3.0
      gate_min_m: 5.0
      gate_max_m: 80.0
      min_sigma_m: 3.0             # м, разброс места остановки у платформы

    slip:
      consistency_abs: 0.3         # м/с
      consistency_rel: 0.03
      consistency_count: 2
      accel_traction: 2.0          # м/с²
      accel_brake: 3.0             # м/с²
      accel_min_dt: 0.3            # с
      stale_s: 0.3                 # с
      stuck_n: 6                   # одинаковых показаний подряд — датчик завис
      stuck_min: 0.3               # м/с, нули на стоянке — не зависание
      mean_band: 0.1               # м/с, тележки ближе — среднее (без смещения от шума)
